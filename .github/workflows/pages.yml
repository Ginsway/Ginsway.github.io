name: Pages Deploy

on:
    push:
        branches:
            - main # default branch

jobs:
    pages:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            
            - name: Setup pnpm
              uses: pnpm/setup@v3
              with:
                version: 12
                runtime: node@24
                cache: true
                install: false
            - name: Install
              run: pnpm approve-builds hexo-util && pnpm install
            - name: Build
              run: pnpm run build
            - name: Deploy
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./public
